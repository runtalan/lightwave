<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="pi.css"><script src="pi.js"></script></head><body>
<main><h1>Govee Lightwave</h1><p class="lead">Direct LAN control. Enable LAN Control in Govee Home, then choose a discovered light or room.</p>
<label>Target <select id="target"><option value="">All managed lights</option></select></label>
<label id="mode-row">Operation <select id="mode"><option value="on">Turn on</option><option value="off">Turn off</option><option value="brightness">Set brightness</option><option value="color">Set color</option><option value="temperature">Set white temperature</option><option value="palette">Apply palette</option><option value="scene">Recall scene</option></select></label>
<label id="value-row">Value <input id="value" type="number" min="1" max="100" value="70"></label>
<label id="color-row">Color <input id="color" type="color" value="#7e30ff"></label>
<label id="palette-row">Palette <select id="palette"></select></label>
<details><summary>Create or update a room</summary><label>Room name <input id="room-name" type="text" placeholder="Studio"></label><div id="members"></div><button id="save-room" type="button">Save room and use it</button></details>
<p id="help">No lights yet? Turn on LAN Control for the device in Govee Home, then restart or wait for the next scan.</p>
</main><script>
const $=id=>document.getElementById(id), target=$('target'),mode=$('mode'),value=$('value'),color=$('color'),palette=$('palette'),roomName=$('room-name'),members=$('members');
function hex(){const x=color.value;return {r:parseInt(x.slice(1,3),16),g:parseInt(x.slice(3,5),16),b:parseInt(x.slice(5,7),16)}}
function visibility(){const m=mode.value;$('value-row').hidden=!['brightness','temperature'].includes(m);$('color-row').hidden=m!=='color';$('palette-row').hidden=m!=='palette';}
document.addEventListener('lw-ready',e=>{const s=e.detail; target.value=s.target||'';roomName.value=s.roomName||'';mode.value=s.mode||({"com.dinksf.govee-lightwave.power":'on',"com.dinksf.govee-lightwave.brightness":'brightness',"com.dinksf.govee-lightwave.color":'color',"com.dinksf.govee-lightwave.temperature":'temperature',"com.dinksf.govee-lightwave.palette":'palette'}[action]||'on');value.value=s.value||70;if(s.r!==undefined)color.value='#'+[s.r,s.g,s.b].map(v=>Number(v).toString(16).padStart(2,'0')).join('');visibility();});
document.addEventListener('lw-catalog',e=>{const d=e.detail;for(const x of d.devices||[]){const o=document.createElement('option');o.value=x.id;o.textContent=`${x.name||x.model} · ${x.model||x.id}`;target.append(o);const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=x.id;c.checked=(settings.members||[]).includes(x.id);l.append(c,document.createTextNode(x.name||x.model||x.id));members.append(l)}for(const r of d.rooms||[]){const o=document.createElement('option');o.value=r.id;o.textContent='Room · '+r.name;target.append(o)}for(const p of d.palettes||[]){const o=document.createElement('option');o.value=p;o.textContent=p;palette.append(o)}if(settings.target)target.value=settings.target;if(settings.palette)palette.value=settings.palette;});
target.onchange=()=>save({target:target.value});mode.onchange=()=>{visibility();save({mode:mode.value})};value.onchange=()=>save({value:Number(value.value)});color.onchange=()=>save(Object.assign({mode:'color'},hex()));palette.onchange=()=>save({mode:'palette',palette:palette.value});
$('save-room').onclick=()=>{const ids=[...members.querySelectorAll('input:checked')].map(x=>x.value);if(!roomName.value.trim()||!ids.length){$('help').textContent='Give the room a name and select at least one discovered light.';return}save({roomName:roomName.value.trim(),members:ids});};
</script></body></html>
